# SonarQube analysis (CI only; see docs/SONARQUBE.md). The token and host URL come from the environment.
sonar.projectKey=athegreat90_ai-watch-web
sonar.projectName=AI Watch Web

# Production code is src/. Specs, the end-to-end tests and the proxy and contract tests are tests.
sonar.sources=src
sonar.exclusions=**/*.spec.ts,src/app/testing/**
sonar.tests=src,e2e,tests
sonar.test.inclusions=**/*.spec.ts,e2e/**/*.ts,tests/**/*.mjs

# Coverage from: npm run test:ci (angular.json writes lcov and a summary).
sonar.javascript.lcov.reportPaths=coverage/ai-watch-web/lcov.info
# The entry point and the test helpers contain no production logic worth measuring.
sonar.coverage.exclusions=src/main.ts,src/app/testing/**,**/*.spec.ts

# docker/, security/ and the shell scripts are checked by their own tests, not by Sonar.

# Fail the analysis when the Quality Gate fails, so CI fails and releases are blocked.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# New-code measures need git blame data.
sonar.scm.provider=git
sonar.scm.disabled=false
