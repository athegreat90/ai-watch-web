# Included in every location that sets its own headers, because Nginx drops the inherited
# add_header lines as soon as a location has one of its own.
#
# Scripts are never inline. 'unsafe-inline' is allowed for styles only, because Angular adds its
# component styles at run time. See MEMORY.md for the reasoning.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Wake Lock and full screen are left allowed on purpose: the kiosk needs them.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
