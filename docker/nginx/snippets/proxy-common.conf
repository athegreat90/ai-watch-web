# Shared by the three proxied routes. Needs $aiw_path set by the location.
include /etc/nginx/snippets/security-headers.conf;

# Reading only. HEAD, POST, PUT, DELETE and OPTIONS are refused here, before the server is asked.
if ($request_method != GET) {
    return 405;
}

# The path is built from variables, so the query string is not passed on, and the server's address
# is looked up when needed (with the resolver from runtime.conf), not only at start.
proxy_pass http://$aiw_upstream$aiw_path;
proxy_http_version 1.1;
proxy_set_header Host $aiw_upstream;
proxy_set_header Connection "close";
proxy_pass_request_body off;
proxy_set_header Content-Length "";

# Nothing the browser sent is passed on except what is set here. In particular a client's own
# X-Monitor-Key, a login for this dashboard and cookies stay behind.
proxy_set_header Authorization "";
proxy_set_header Cookie "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Real-IP "";

proxy_connect_timeout 2s;
proxy_send_timeout 3s;
proxy_read_timeout 5s;

proxy_hide_header Server;
proxy_hide_header X-Powered-By;
proxy_hide_header Set-Cookie;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;

add_header Cache-Control "no-store" always;
# Set only when the AI Watch server itself answered. The app uses it to tell "the server refused
# the token" (401 with this header) from "the dashboard login" (401 without it).
add_header X-AIW-Upstream-Status $upstream_status always;
