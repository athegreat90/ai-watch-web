# The two data routes: they need the monitor key, and they are cached for one second.
include /etc/nginx/snippets/proxy-common.conf;

proxy_set_header X-Monitor-Key $aiw_monitor_key;

proxy_cache aiw;
proxy_cache_key $aiw_path;
proxy_cache_valid 200 1s;
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_use_stale updating;
# The server sends `no-store`, which would switch the cache off.
proxy_ignore_headers Cache-Control Expires Set-Cookie;
