root /usr/share/nginx/html;

# Optional login for the whole dashboard. Empty unless a password file was mounted.
include /tmp/nginx/auth.conf;

# The container's own health check. It does not depend on the AI Watch server and needs no login.
location = /healthz {
    auth_basic off;
    access_log off;
    default_type text/plain;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
}

# Non-secret settings written at start (see the entrypoint). Never cached.
location = /config.json {
    default_type application/json;
    alias /tmp/nginx/config.json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
}

# The only three routes of the AI Watch server this app may reach, GET only. The server treats
# a query string as part of the path, so none is passed on (see snippets/proxy-api.conf).
location = /health {
    set $aiw_path /health;
    include /etc/nginx/snippets/proxy-public.conf;
}

location = /api/status {
    set $aiw_path /api/status;
    include /etc/nginx/snippets/proxy-api.conf;
}

location = /api/sessions {
    set $aiw_path /api/sessions;
    include /etc/nginx/snippets/proxy-api.conf;
}

# Everything else under /api/ is blocked, including the write routes (/api/events, /api/event,
# /api/limits). The prefix match also catches /api/status/ and /api/anything.
location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 404;
}

# Files with a hash in their name never change, so they are cached for a year.
location ~ "^/(main|polyfills|chunk|styles)-[A-Za-z0-9]+\.(js|css)$" {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Other files (the icon, theme-init.js): the browser checks before reusing them. A missing file is
# a 404, not the app, so a broken link is not hidden.
location ~* "\.[a-z0-9]+$" {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# The app. Any other path is a route of the single page app. index.html is never cached, so a new
# release is picked up at once.
location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}
