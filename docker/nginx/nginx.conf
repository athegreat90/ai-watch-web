# Main Nginx configuration. It is read-only in the image. Everything that depends on the
# deployment (the server's address, the token, the optional login) is written to /tmp/nginx by
# the entrypoint when the container starts, and included below.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The access log has the path without the query string and never a header, so it cannot
    # hold the token or a password.
    log_format aiw '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout aiw;

    # Nginx needs a writable place for these. The container has only /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 1k;
    client_body_buffer_size 1k;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # About a second of cache for the two data routes. Nginx counts in whole seconds, so an entry
    # lives between 1 and 2 seconds. The AI Watch server accepts only 16 open
    # connections, and every browser polls every few seconds. The cache lets many browsers share
    # one request per second. The server says `no-store`, which Nginx would obey, so it is ignored
    # here on purpose, and the browser is still told `no-store` (see snippets/proxy-api.conf).
    proxy_cache_path /tmp/cache levels=1 keys_zone=aiw:1m max_size=2m inactive=10s use_temp_path=off;

    # Written by the entrypoint: the resolver, the server's address and the monitor key.
    include /tmp/nginx/runtime.conf;

    server {
        listen 8080;
        server_name _;
        include /etc/nginx/site.conf;
    }
}
